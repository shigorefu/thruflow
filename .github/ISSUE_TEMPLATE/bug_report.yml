name: Bug report
description: Report a reproducible ThruFlow problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ThruFlow. Remove private Task names, notes, screenshots, and exports before submitting.

  - type: input
    id: version
    attributes:
      label: App version and build
      description: For example, 1.0 (1).
      placeholder: 1.0 (1)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - iPhone
        - iPad
        - Apple Watch
        - Widget / Live Activity
        - Multiple platforms
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Device and OS
      placeholder: iPhone model, iOS version, paired Watch if relevant
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from a known screen or app state and list the smallest reliable sequence.
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Additional context
      description: Add sanitized screenshots, logs, frequency, and whether iCloud or local-only storage was used.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed personal or sensitive productivity data.
          required: true
        - label: This is not a security vulnerability.
          required: true
